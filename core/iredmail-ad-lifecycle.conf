# =============================================================================
# iRedMail + Active Directory Mailbox Lifecycle
# Жизненный цикл почтовых ящиков iRedMail + Active Directory
# =============================================================================
#
# ЛОГИКА / LOGIC
# -----------------------------------------------------------------------------
# Архивирование разрешено ТОЛЬКО когда одновременно выполняются условия:
# Archiving is allowed ONLY when BOTH conditions are true:
#
#   1) Учетная запись AD отключена (ACCOUNTDISABLE bit 0x2).
#      The AD account is disabled (ACCOUNTDISABLE bit 0x2).
#
#   2) extensionAttribute6 = 0 ("Уволен(а)").
#      extensionAttribute6 = 0 ("Terminated").
#
# Все остальные состояния НЕ архивируются автоматически.
# All other states are NEVER archived automatically.
#
# Кадровые статусы / Employee statuses:
#
#   0 = Уволен(а)                         / Terminated
#   1 = Работает                          / Working
#   2 = Отпуск по уходу за ребёнком       / Childcare leave
#   3 = Отпуск                            / Vacation
#   4 = Больничный                        / Sick leave
#   5 = Командировка                      / Business trip
#   6 = Отсутствует                       / Absent
#   7 = Отпуск по беременности и родам    / Maternity leave
#   8 = Трудоустройство                   / Employment onboarding
#
# ВАЖНО / IMPORTANT:
# Пользователь, полностью удалённый из AD, автоматически НЕ архивируется:
# его extensionAttribute6 уже невозможно проверить.
#
# A user completely missing from AD is NOT archived automatically because
# extensionAttribute6 can no longer be verified.
# =============================================================================


# =============================================================================
# LDAP / ACTIVE DIRECTORY
# =============================================================================

# URI LDAP-сервера AD.
# Active Directory LDAP server URI.
#
# В этой инфраструктуре используется LDAP 389 + STARTTLS.
# This environment uses LDAP 389 + STARTTLS.
LDAP_URI="ldap://example.org:389"


# Сервисная учётная запись для чтения AD.
# Service account used for read-only AD queries.
#
# Достаточно обычных прав чтения каталога; Domain Admin не требуется.
# Normal directory read permissions are enough; Domain Admin is not required.
BIND_DN="svc-lifecycle@example.org"


# Файл с паролем BIND_DN.
# File containing the BIND_DN password.
#
# Рекомендуемые права / Recommended permissions:
#   chmod 600 /root/.ldap-vmail.pass
#
# Файл должен содержать только пароль, без имени пользователя.
# The file must contain only the password, not the username.
BIND_PW_FILE="/root/.ldap-vmail.pass"


# База LDAP-поиска.
# LDAP search base.
#
# ВНИМАНИЕ: пользователи за пределами этого OU не будут найдены.
# WARNING: users outside this OU will not be found.
BASE_DN="OU=Users,DC=example,DC=org"


# Основной адрес должен соответствовать LDAP-маппингу почтового стека.
# Primary address must match the mail stack's LDAP mapping.
# В вашей SOGo mail отображается из UPN: используйте userPrincipalName.
# Your SOGo maps mail from UPN: use userPrincipalName.
# Если реальная конфигурация использует AD mail, выберите mail явно.
# If the actual configuration uses AD mail, explicitly select mail.
# Старый конфиг сохраняется; .conf.dist не применяет новые значения автоматически.
# Existing config is preserved; .conf.dist does not apply these values automatically.
ADDRESS_ATTRIBUTE="userPrincipalName"

# Дополнительные источники ВЫКЛЮЧЕНЫ. 1 добавляет только защитные совпадения:
# адрес, найденный только здесь, не разрешает штатную архивацию даже при disabled+0.
# Extra sources are OFF. 1 adds presence protection only: an extra-only match
# never authorizes normal archival, even for disabled+0.
ADDRESS_INCLUDE_MAIL=0
ADDRESS_INCLUDE_SMTP_ALIASES=0


# Кадровый атрибут.
# HR/employee status attribute.
EMPLOYEE_STATUS_ATTRIBUTE="extensionAttribute6"


# Значение кадрового атрибута, означающее увольнение.
# Employee status value meaning "terminated".
# Политика этой версии разрешает только 0; другое значение блокирует запуск.
# This version's policy permits only 0; another value stops the run.
TERMINATED_STATUS_VALUE="0"


# LDAP-фильтр объектов пользователей.
# LDAP filter for user objects.
#
# Disabled-пользователи намеренно НЕ исключаются:
# скрипт обязан видеть их userAccountControl и extensionAttribute6.
#
# Disabled users are intentionally included because the script must inspect
# both userAccountControl and extensionAttribute6.
# Не фильтруем по наличию UPN/mail: УЗ без почты нужны для контроля полноты AD.
# Do not require UPN/mail presence: mail-less users count toward AD query health.
LDAP_FILTER='(&(objectClass=person)(objectCategory=user))'


# Дополнительные параметры ldapsearch.
# Additional ldapsearch arguments.
#
# -ZZ = STARTTLS обязателен / require STARTTLS.
LDAP_EXTRA_ARGS=(-ZZ)


# Размер LDAP page.
# LDAP page size.
#
# Используется для AD с количеством объектов больше стандартного лимита.
# Useful when AD contains more objects than the server's normal result limit.
LDAP_PAGE_SIZE=1000


# =============================================================================
# MAIL STORAGE / ПОЧТОВОЕ ХРАНИЛИЩЕ
# =============================================================================

# Корневой каталог iRedMail.
# iRedMail mailbox root.
VMAIL_ROOT="/var/vmail/vmail1"


# Домены, которые обрабатывает скрипт.
# Domains processed by the script.
#
# Несколько доменов / Multiple domains:
# MAIL_DOMAINS=("example.org" "example.ru")
MAIL_DOMAINS=("example.org")


# =============================================================================
# ARCHIVE / АРХИВ
# =============================================================================

# Корень архива.
# Archive root.
#
# Рекомендуется отдельный диск, раздел или NAS.
# A separate disk/filesystem/NAS is strongly recommended.
ARCHIVE_ROOT="/mnt/mail-archive/iredmail"


# Требовать отдельную файловую систему для архива.
# Require the archive to be on a different filesystem.
#
# 1 = да / yes
# 0 = нет / no
#
# При 1 рабочий запуск остановится, если VMAIL_ROOT и ARCHIVE_ROOT находятся
# на одной файловой системе.
#
# With 1, live mode stops if VMAIL_ROOT and ARCHIVE_ROOT are on the same
# filesystem.
REQUIRE_SEPARATE_ARCHIVE_FS=1


# =============================================================================
# DRY RUN / ТЕСТОВЫЙ РЕЖИМ
# =============================================================================

# 1 = только отчёт; ничего не копировать и не удалять.
#     Report only; do not copy or delete anything.
#
# 0 = реальное архивирование разрешено.
#     Real archive operations are allowed.
#
# Первый запуск ВСЕГДА делайте с DRY_RUN=1.
# ALWAYS perform the first run with DRY_RUN=1.
#
# Дополнительно команда --report принудительно включает безопасный режим
# только для конкретного запуска, даже если здесь DRY_RUN=0.
#
# The --report command-line option forces safe report-only mode for that run,
# even if DRY_RUN=0 here.
DRY_RUN=1


# =============================================================================
# TERMINATED USERS / УВОЛЕННЫЕ ПОЛЬЗОВАТЕЛИ
# =============================================================================

# Сколько дней ждать после первого обнаружения условия:
#
#   AD disabled AND extensionAttribute6=0
#
# перед переносом Maildir в архив.
#
# Number of days to wait after first detecting:
#
#   AD disabled AND extensionAttribute6=0
#
# before moving the mailbox to the archive.
#
# 0 = архивировать сразу / archive immediately
# 7 = ждать 7 дней / wait 7 days
# 30 = ждать 30 дней / wait 30 days
TERMINATED_ARCHIVE_DAYS=0


# =============================================================================
# ARCHIVE RETENTION / СРОК ХРАНЕНИЯ АРХИВА
# =============================================================================

# Через сколько дней окончательно удалять архивированные ящики.
# Number of days after which archived mailboxes are permanently deleted.
#
# 0 = никогда автоматически не удалять архив.
#     Never purge archives automatically.
#
# ВНИМАНИЕ: значение >0 включает безвозвратное удаление старых архивов.
# WARNING: a value >0 enables permanent deletion of expired archives.
#
# Для первого внедрения разумно временно поставить 0,
# затем включить нужный срок после проверки восстановления.
#
# For initial deployment it is prudent to use 0 until restore procedures
# have been tested.
ARCHIVE_RETENTION_DAYS=90


# =============================================================================
# SAFETY / ЗАЩИТНЫЕ ОГРАНИЧЕНИЯ
# =============================================================================

# Минимальное количество объектов пользователей AD, а не адресов/алиасов.
# Minimum AD user-object count, not the number of addresses/aliases.
#
# Если AD вернет меньше, скрипт завершится БЕЗ изменения почты.
# If AD returns fewer users, the script exits WITHOUT changing mailboxes.
#
# В вашей среде ранее было около 758 пользователей.
# Your environment previously returned about 758 users.
EXPECTED_MIN_USERS=700


# Максимальный процент всех Maildir, одновременно классифицированных как
# "terminated" и, следовательно, потенциально подлежащих архивированию.
#
# Maximum percentage of all Maildirs that may simultaneously be classified
# as "terminated" and therefore eligible for archiving.
#
# Это защита от неправильного LDAP-фильтра/атрибута или массовой ошибки
# в кадровом атрибуте.
#
# This protects against a bad LDAP filter/attribute mapping or a mass HR
# attribute mistake.
#
# Например, 10 означает: если >10% всех ящиков внезапно стали terminated,
# скрипт остановится.
#
# Example: 10 means the script stops if >10% of all mailboxes suddenly become
# terminated.
MAX_TERMINATED_PERCENT=10


# Минимально допустимое отношение размера копии к исходнику в процентах.
# Minimum allowed destination/source byte ratio after rsync.
#
# Дополнительно проверяется совпадение количества обычных файлов.
# Regular-file counts are also compared.
VERIFY_MIN_PERCENT=99


# =============================================================================
# REPORTING / ОТЧЁТЫ
# =============================================================================

# Считать размер каждого ящика для CSV-отчёта.
# Calculate every mailbox size for the CSV report.
#
# 0 = не считать; быстрее и меньше нагрузка на диск.
#     Do not calculate; faster and lower I/O load.
#
# 1 = считать размер всех ящиков через du.
#     Calculate all mailbox sizes using du.
#
# При большом хранилище для ежедневного запуска рекомендуется 0.
# For a large mail store, 0 is recommended for daily runs.
REPORT_MAILBOX_SIZES=0


# =============================================================================
# STATE / СОСТОЯНИЕ
# =============================================================================

# Здесь хранится дата первого обнаружения статуса terminated.
# Stores the first-seen timestamp for the terminated state.
#
# Используется TERMIНATED_ARCHIVE_DAYS.
# Used by TERMINATED_ARCHIVE_DAYS.
STATE_DIR="/var/lib/iredmail-ad-lifecycle"


# =============================================================================
# LOG / ЖУРНАЛ
# =============================================================================

# Основной журнал.
# Main log file.
LOG_FILE="/var/log/iredmail-ad-lifecycle.log"


# Каталог CSV-отчётов каждого запуска.
# Directory containing per-run CSV reports.
REPORT_DIR="/var/log/iredmail-ad-lifecycle-reports"


# =============================================================================
# LOCK / БЛОКИРОВКА
# =============================================================================

# Lock-файл предотвращает одновременный запуск нескольких экземпляров.
# Lock file prevents multiple instances from running at the same time.
LOCK_FILE="/run/iredmail-ad-lifecycle.lock"

# =============================================================================
# LEGACY CLEANUP / ОЧИСТКА СТАРЫХ ЯЩИКОВ, УДАЛЁННЫХ ИЗ AD
# =============================================================================

# 0 = штатная политика: missing только в отчёте.
# 1 = отдельный ручной запуск без флага использует approved legacy archive.
#     Требуются инвентаризация и allowlist; массовый режим этим не включается.
# 0 = normal policy: missing is report-only.
# 1 = a manual run without an operation flag uses approved legacy archive.
#     Inventory and allowlist are required; this never enables bulk approval.
# systemd использует --normal и игнорирует LEGACY_MODE.
# systemd uses --normal and ignores LEGACY_MODE.
LEGACY_MODE=0

# Широкая база: корень домена, включающий BASE_DN и остальные OU.
# Wide base: domain root containing BASE_DN and all relevant OUs.
# Поиск всегда проверяет ADDRESS_ATTRIBUTE, UPN, mail и SMTP proxyAddresses,
# независимо от переключателей дополнительных штатных источников.
# Search always checks ADDRESS_ATTRIBUTE, UPN, mail and SMTP proxyAddresses,
# independent of optional normal address-source switches.
# AD domain-scope control: все OU одного naming context, без referrals в DNS-разделы.
# AD domain-scope control: all OUs in one naming context, without DNS partition referrals.
# Дочерние AD-домены/другие naming contexts не включаются автоматически.
# Child AD domains/other naming contexts are not included automatically.
# УЗ bind должна видеть все нужные OU; AD не доказывает отсутствие скрытых объектов.
# Bind must see all relevant OUs; AD cannot prove absence of hidden objects.
LEGACY_SEARCH_BASE="DC=example,DC=org"

# Минимум дней с последнего mtime файлов И каталогов внутри ящика.
# Minimum days since latest file AND directory mtime inside the mailbox.
# Это файловая активность, а не дата входа пользователя; никакой inference об увольнении.
# This is filesystem activity, not last login; it does not infer termination.
# Даже одобренный ящик моложе порога не перемещается; будущие mtime блокируют перенос.
# Even approved mailboxes below this threshold stay; future mtimes block archival.
LEGACY_MIN_INACTIVE_DAYS=365

# Явно одобренные адреса: CSV email,approved (YES), либо TXT адрес на строку.
# Explicitly approved emails: CSV email,approved (YES), or TXT one email per line.
# Пустой файл/путь запрещает approved archive; сама инвентаризация НЕ является approval.
# Empty file/path blocks approved archive; inventory itself is NOT approval.
LEGACY_APPROVAL_FILE=""

# Проверенная CSV-инвентаризация; можно передать --inventory FILE вместо конфига.
# Reviewed CSV inventory; --inventory FILE overrides this setting.
# Для нового снимка укажите новое имя файла; существующий CSV не перезаписывается.
# Use a new filename for a new snapshot; existing CSV files are not overwritten.
LEGACY_INVENTORY_FILE=""

# Отдельный корень legacy; рекомендуем соседний каталог на том же архивном диске.
# Separate legacy root; a sibling directory on the archive disk is recommended.
# Допустим прямой подкаталог ARCHIVE_ROOT/legacy, не совпадающий с почтовым доменом.
# A direct ARCHIVE_ROOT/legacy subdirectory is allowed if it is not a mail domain.
# Штатная retention его исключает; одинаковые/опасно перекрывающиеся корни запрещены.
# Normal retention excludes it; equal/unsafe overlapping roots are rejected.
LEGACY_ARCHIVE_ROOT="/mnt/mail-archive/iredmail-legacy"

# Дни хранения от успешного переноса, а не от возраста исходных писем.
# Retention days since successful archival, not the age of source messages.
# 0 = хранить бессрочно. >0 применяется ТОЛЬКО явной командой --legacy-purge.
# 0 = keep forever. >0 applies ONLY with explicit --legacy-purge.
# Штатный timer legacy-архив не удаляет. Незавершённые копии не удаляются автоматически.
# Normal timer never purges legacy archives. Incomplete copies are never auto-purged.
LEGACY_RETENTION_DAYS=0

# Максимум одобренных ящиков за один archive-запуск; превышение останавливает весь пакет.
# Maximum approved mailboxes per archive run; excess aborts the entire batch.
# --legacy-purge также ограничивает количество удалений этим значением.
# --legacy-purge also caps deletion count with this setting.
# 0 не отключает защиту: допустимы только положительные значения.
# 0 does not disable the guard: only positive values are allowed.
LEGACY_MAX_COUNT=20

# Максимум % одобренных от ВСЕХ обнаруженных ящиков настроенных доменов в текущем запуске.
# Maximum % approved relative to ALL discovered mailboxes of configured domains this run.
# Проверяется без округления вниз; вместе с MAX_COUNT, до любых перемещений.
# Checked without rounding down; enforced together with MAX_COUNT, before any moves.
# Допустимо >0 и <=100. Для многолетних missing делайте небольшие approval-пакеты.
# Must be >0 and <=100. Process years of missing mailboxes in small approval batches.
LEGACY_MAX_PERCENT=5

# Постоянные исключения: отдельный root-owned JSON; не редактируйте через web-процесс.
# Persistent exclusions: root-owned JSON, updated only by locked CLI/root-worker.
# Защищает ящик от normal/legacy archive и его архивы от retention.
# Protects normal/legacy archival and retention of this address's archives.
# Восстановление автоматически добавляет исключение. Пустой список создаётся при первом изменении.
# Restore automatically adds protection. A missing file means an empty list for upgrades.
EXCLUSION_FILE="/var/lib/iredmail-ad-lifecycle/exclusions.json"

# RU: Ограничения только ЯВНОГО массового удаления. Штатный timer их не использует.
# EN: Limits for explicit batch deletion only. No automatic deletion is enabled.
# Действуют при preview и перед первым удалением / Checked at preview and commit.
# MAX_COUNT: 1..500; MAX_PERCENT: 1..100 от ВСЕХ рабочих flat Maildir-ящиков
# в MAIL_DOMAINS, включая активные/защищённые. Превышение отменяет весь пакет.
# MAX_PERCENT counts all flat Maildir mailboxes in MAIL_DOMAINS, including protected.
MANUAL_DELETE_MAX_COUNT=100
MANUAL_DELETE_MAX_PERCENT=25

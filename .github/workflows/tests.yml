name: Linux fixture tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r console/requirements.txt
      - name: Syntax and standard-library worker imports
        run: |
          python -m compileall -q core console
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n 1 bash -n
          python -S -c 'import sys; sys.path.insert(0,"console"); import worker, config_service'
      - name: Core and console fixtures (no production AD or mailbox access)
        run: |
          # Exclusion and archive ownership guards require root-owned ancestors.
          # This is an ephemeral GitHub VM; every mailbox is a temporary fixture.
          sudo install -d -m 0700 /var/lib/lifecycle-fixture-tests
          for test in core/tests/test_*.py; do
            sudo env LIFECYCLE_TEST_TMP=/var/lib/lifecycle-fixture-tests "$(command -v python)" "$test"
          done
          for test in console/tests/test_*.py; do
            python "$test"
          done
